# Local stack: Kafka (KRaft, single node) + API + ingestion consumer + pollers.
#   docker compose -f deploy/docker-compose.yml up --build
# Secrets come from deploy/.env (not committed): ANTHROPIC_API_KEY, SEC_USER_AGENT
services:
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: [.env]
    environment:
      ALPHA_BROKER_URL: kafka://kafka:9092
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--with-ops"]
    volumes: [alpha-data:/data, alpha-models:/models]
    ports: ["8000:8000"]
    depends_on: [kafka]

  ingest-consumer:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: [.env]
    environment:
      ALPHA_BROKER_URL: kafka://kafka:9092
    command: ["consume", "--score"]
    volumes: [alpha-data:/data, alpha-models:/models]
    depends_on: [kafka]

  pollers:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: [.env]
    environment:
      ALPHA_BROKER_URL: kafka://kafka:9092
    command: ["poll", "--tickers", "AAPL", "MSFT", "NVDA", "--interval", "900"]
    depends_on: [kafka]

volumes:
  alpha-data:
  alpha-models:
