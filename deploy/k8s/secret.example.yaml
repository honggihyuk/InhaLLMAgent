# Example only - do NOT commit real values. Create with:
#   kubectl -n alphaagent create secret generic alphaagent-secrets \
#     --from-literal=ANTHROPIC_API_KEY=... --from-literal=SEC_USER_AGENT="Your Org you@example.com"
# or manage it with External Secrets / Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: alphaagent-secrets
  namespace: alphaagent
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<set me>"
  SEC_USER_AGENT: "<Org Name contact@example.com>"
