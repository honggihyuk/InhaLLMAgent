# Kafka via the Strimzi operator (install it first: https://strimzi.io/quickstarts/).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: alphaagent
  labels:
    strimzi.io/cluster: alphaagent
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 100Gi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: alphaagent
  namespace: alphaagent
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.7.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: docs.raw
  namespace: alphaagent
  labels: {strimzi.io/cluster: alphaagent}
spec:
  partitions: 6
  replicas: 3
  config: {retention.ms: 2592000000}  # 30 days: lets a rebuilt index replay recent documents
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: docs.indexed
  namespace: alphaagent
  labels: {strimzi.io/cluster: alphaagent}
spec: {partitions: 6, replicas: 3}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: signals.text
  namespace: alphaagent
  labels: {strimzi.io/cluster: alphaagent}
spec: {partitions: 6, replicas: 3, config: {cleanup.policy: compact}}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: agents.messages
  namespace: alphaagent
  labels: {strimzi.io/cluster: alphaagent}
spec: {partitions: 3, replicas: 3}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: ops.alerts
  namespace: alphaagent
  labels: {strimzi.io/cluster: alphaagent}
spec: {partitions: 1, replicas: 3, config: {retention.ms: 31536000000}}
